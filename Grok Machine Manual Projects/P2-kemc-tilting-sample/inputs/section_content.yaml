section_11:
  title: "11. Safety Features & Interlocks"
  11_1:
    title: "11.1 Safety Architecture"
    content: |
      Safety measures combine fixed guarding, electro-sensitive protective equipment (light curtain), two-hand control for cycle start, emergency stop, electrical isolation, and pneumatic isolation, supported by administrative controls (training, PPE, procedures, signage).
  11_2:
    title: "11.2 Safety Control System"
    content: |
      A safety-rated controller (SRPCS) is identified in the Machine Safety Assessment machine documentation imagery. Exact product model, I/O map, and validated safety functions shall be confirmed from manufacturer documentation (OA-P2G-007).
  11_3:
    title: "11.3 Safety Device Inventory"
    content: TABLE_SAFETY_DEVICES
  11_4:
    title: "11.4 Safety Interlock Logic (Overview)"
    content: FLOWCHART_SAFETY_LOGIC
  11_5:
    title: "11.5 Safety Function Testing Requirements"
    content: |
      • Daily/shift: E-Stop, visual guard check, light curtain obstruction test if site procedure requires.
      • After maintenance affecting safety: re-test affected functions before production.
      • Record results in Appendix A maintenance log.
  11_6:
    title: "11.6 Prohibited Actions"
    content: |
      • Muting, bypassing, or defeating light curtains, two-hand controls, E-Stops, or guards.
      • Reaching into the process zone during automatic motion.
      • Operating with missing or open fixed guards.
      • Maintenance without LOTO.
      • Allowing untrained visitors inside barriers.

section_12:
  title: "12. Compliance & Certifications"
  12_1:
    title: "12.1 International Safety Standards"
    content: |
      This manual and the associated risk assessment approach reference the following standards framework:
      • ISO 12100:2010 — Safety of machinery — General principles for design — Risk assessment and risk reduction
      • ISO 20607:2019 — Safety of machinery — Instruction handbooks — General drafting principles
      • IEC 82079-1:2019 — Preparation of instructions for use
      • ISO 13850 — Emergency stop function
      • ISO 13849-1 — Safety-related parts of control systems (performance level concepts as used in assessment)
      • ISO 13851 / ISO 13855 — Two-hand control and positioning of safeguards (as referenced for cycle start / light curtain)
      • ISO 14120 / ISO 13857 — Guards and safety distances (as referenced for fixed guard)
      • ISO 4414 — Pneumatic fluid power (as referenced for air isolation)
      • IEC 60204-1 — Electrical equipment of machines (as referenced)
      • ANSI B11.19 — performance criteria for safeguarding (as referenced for awareness signs in assessment)
  12_2:
    title: "12.2 Indian Standards & Regulations"
    content: |
      • IS 4571:2008 — related machinery safety documentation practice as applied by the manual authoring framework
      • Factories Act, 1948 and applicable State Factory Rules — employer duties for safe working systems, training, and guarding
  12_3:
    title: "12.3 Component-Level Standards"
    content: |
      Component conformity (light curtain Type 4, safety controller, etc.) shall be verified against manufacturer declarations. This sample does not restate unconfirmed certificates.
  12_4:
    title: "12.4 Compliance Statement"
    content: |
      LIABILITY DISCLAIMER

      This Operating & Safety Manual has been prepared by a Certified Safety Professional in accordance with ISO 12100:2010, ISO 20607:2019, IEC 82079-1:2019, and IS 4571:2008, based on the Machine Safety Assessment and technical information available for this Grok sample draft.

      Where original technical data was unavailable, items are marked as placeholders or logged as Open Actions. The customer and manufacturer are responsible for final review and verification before the machine is placed into service or this manual is released as controlled issue.

      Neither the consulting practice nor the author assumes liability for injuries or damages resulting from: non-compliance with this manual; failure to maintain per the schedule; operation by untrained personnel; or use of superseded draft sample content without formal release.
