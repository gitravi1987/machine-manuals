section_1:
  title: "1. Front Matter"
  1_1:
    title: "1.1 Document Scope"
    content: |
      This Operating & Safety Manual (OSM) provides information required for the safe installation reference, operation, maintenance, and energy isolation of the Tilting Machine manufactured by Karthick Engineering & Maintenance Consultants (KEMC).

      The manual is prepared in accordance with the principles of ISO 20607:2019 (instruction handbooks for machinery), ISO 12100:2010 (risk assessment and risk reduction), IEC 82079-1:2019 (preparation of instructions for use), and IS 4571:2008, supported by the Machine Safety Assessment performed on site (report date 16 February 2026).

      This document is a Grok capability-sample draft (Tier B). Items marked as placeholders or open actions must be closed before treating the manual as customer-released.
  1_2:
    title: "1.2 Intended Audience"
    content: |
      This manual is intended for:
      • Production operators (instructed persons) who load, cycle, and unload clutch plates
      • Maintenance and troubleshooting personnel (skilled persons)
      • Supervisors and safety representatives
      • Visitors and contractors who may be present near the machine (awareness only)

      Untrained personnel shall not operate, adjust, or maintain this machine.
  1_3:
    title: "1.3 General Safety Rules"
    content: |
      • Read this manual and the Machine Safety Assessment before operating or servicing the machine.
      • Only trained and authorised persons may operate the Tilting Machine.
      • Never bypass light curtains, two-hand controls, guards, or interlocks.
      • Apply full Lockout/Tagout (Section 4) before any intervention inside guarded zones, jaw setup, fixture changeover, or electrical/pneumatic work.
      • Wear required PPE: safety footwear and hand protection as specified by the manufacturer or site rules.
      • Keep hands clear of clamps, tilting mechanism, and moving parts during motion.
      • Do not operate with guards removed or disabled.
      • Report damaged safety devices immediately and take the machine out of service until restored.
