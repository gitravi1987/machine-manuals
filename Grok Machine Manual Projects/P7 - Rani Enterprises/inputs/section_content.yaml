  2_3:
    title: "2.3 Intended Use"
    content: |
      The machine is intended to apply a programmed sealant/glue path onto a component placed on the fixture tray, under automatic door enclosure and interlocked side access, started by two-hand control in AUTO mode.

      Intended users: trained production operators and skilled maintenance personnel.

      Reasonably foreseeable misuse includes: reaching into the cell during robot motion or door closure; bypassing two-hand, door, or E-Stop devices; teaching or changing robot programs without authorisation; operating with side doors open or interlocks defeated; running without adequate air pressure; ignoring parking/purge requirements causing tip blockage and improvised clearing; and performing electrical/pneumatic work without LOTO.
  2_4:
    title: "2.4 Layout & Key Zones"
    content: |
      Free-standing aluminium-frame cell on castors (site photos). Key zones:

      • Operator load/unload face with two-hand stations and automatic front door
      • Process zone: Fisnar robot, dispenser, fixture tray, parking and purging cups
      • Left/right side doors with non-contact safety switches
      • Upper front control face: HMI, indicators
      • Side/rear control panel (Bhartia BCH) with isolator, FRL, internal PLC/PSU
      • Tower light on top structure

