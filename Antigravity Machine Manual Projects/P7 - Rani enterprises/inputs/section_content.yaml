section_6:
  title: "6. Operating Instructions"
  6_1:
    title: "6.1 Pre-Start Checks"
    content: |
      Before production:
      • Guards and side doors closed and undamaged; Omron switches seated
      • Front automatic door free of obstruction
      • Main isolator ON; HMI powered; tower light functioning
      • Plant air present; FRL gauge near expected operating pressure (~6 bar plant; dispenser range per Settings)
      • No active emergency on HMI; E-Stops released
      • Correct model selected (e.g. JPTP / MGTP / APTDPT)
      • Sealant cartridge installed and within process life; tip clean
      • Work area clear; authorised operator only
  6_2:
    title: "6.2 Startup (flowchart)"
    content: FLOWCHART_STARTUP
    flowchart:
      - "Turn POWER isolator ON"
      - "Confirm air supply ready"
      - "Release all E-Stops"
      - "HMI boots to GLUE DISPENSER"
      - "Select AUTO or MANUAL"
      - "Select model program"
      - "Clear any alarms"
      - "Verify doors closed"
      - "Ready for cycle"
  6_3:
    title: "6.3 Automatic Production Cycle (flowchart)"
    content: FLOWCHART_AUTO_CYCLE
    flowchart:
      - "Select model on HMI"
      - "Place component on tray"
      - "Hands on both green starts"
      - "Press two-hand together"
      - "Front door closes"
      - "Robot dispenses sealant"
      - "Cycle ends door opens"
      - "Unload finished part"
    narrative: |
      Intake process: after the job is placed in the tray, press the two-hand push buttons; the door slides down from the top; glue application runs; then unload.

      **WARNING:** Keep hands outside the door path and robot envelope during the cycle. Do not reach in if the door fails to close or the robot is still moving.
  6_4:
    title: "6.4 Model Selection"
    content: |
      From HMI MODEL SELECTION (photo): running model and robot program number are displayed. Observed model names include JPTP, MGTP, and APTDPT. Select the model matching the component before starting production.

      Unauthorised model/program changes can apply sealant incorrectly and may create unexpected robot paths. Only authorised persons may change models or teach programs (OA-P7-011).
  6_5:
    title: "6.5 Manual Mode"
    content: |
      MANUAL mode is available on the HMI for setup and recovery tasks. Manual operations must be performed only by trained personnel with an understanding of robot motion and door behaviour.

      **CAUTION:** Manual mode does not remove the need for LOTO when hands enter the cell for tool or tip work.
  6_6:
    title: "6.6 Parking and Purging"
    content: |
      The machine provides parking and purging cups for the dispenser tip (photos). HMI Settings observed:
      • Idle Time To Go Parking: 3.0 Min
      • Parking & Purging Sequence: ON

      Purpose: if the tip is left idle, sealant can dry and block dispensing. Use automatic parking/purging and the robot DISPENSER PURGE control as trained.

      **NOTICE:** Intake notes mentioned a shorter idle risk (~1 minute). As-built HMI setting photographed is 3.0 minutes. Confirm process requirement with the sealant SDS and OEM (OA-P7-006).
    images:
      - "Images/dispenser parking.jpg"
      - "Images/dispenser purging.jpg"
      - "Images/Dispenser.jpg"
  6_7:
    title: "6.7 Shutdown (flowchart)"
    content: FLOWCHART_SHUTDOWN
    flowchart:
      - "Complete or abort cycle safely"
      - "Park or purge dispenser tip"
      - "Clear HMI to idle state"
      - "Turn isolator OFF if end of shift"
      - "Isolate air if required by site"
      - "Clean work area"
      - "Record issues in log"
  6_8:
    title: "6.8 Forbidden Actions"
    content: |
      • Bypass two-hand, door sensors, or E-Stops
      • Operate with side doors open in production
      • Disable Front Automatic Safety Door or Side Door Safety Sensor settings without formal change control
      • Teach robot programs without authorisation
      • Clear tip blockage with unguarded hands while power/air available
      • Work in the panel without electrical LOTO

