section_8:
  title: "8. HMI, Alarms & Controls"
  8_1:
    title: "8.1 HMI Overview"
    content: |
      Mitsubishi Electric HMI application title: GLUE DISPENSER.

      Main menu functions observed (HMI Modes photo): AUTO, MANUAL, MODEL SELECTION, SETTINGS, ALARM, ALARM HISTORY, DATA LOG, INPUT STATUS, OUTPUT STATUS.

      Process screen shows mode and door/air/robot status lamps, model, robot program number, OK/NG/TOTAL counts, cycle time, and dispenser pressure.

      Network labels shown on menu photo: PLC 192.168.100.010, HMI 192.168.100.011 (confirm before network changes — OA-P7-009).
    images:
      - "Images/HMI Modes.jpg"
      - "Images/HMI Process.jpg"
      - "Images/HMI Modes 2.jpg"
  8_2:
    title: "8.2 Settings Screen (as photographed)"
    content: |
      Observed Settings parameters:
      • Dispenser Inlet Pressure Min/Max: 2.00 / 3.00 Bar
      • Pressure Check Delay: 1.0 Sec
      • Dispenser Pressure Check: ON
      • Side Door Safety Sensor: ON
      • Front Automatic Safety Door: ON
      • Idle Time To Go Parking: 3.0 Min
      • Parking & Purging Sequence: ON

      **WARNING:** Disabling Side Door Safety Sensor or Front Automatic Safety Door in Settings bypasses safety functions and shall be restricted to authorised personnel during formal maintenance procedures (OA-P7-005).
    images:
      - "Images/HMI Settings.jpg"
  8_3:
    title: "8.3 Observed Live Alarms"
    content: |
      Live alarms recorded on HMI ALARM screen (Images/HMI Alarms.jpg):

      1. Air Pressure Low — Low main air pressure (below 4 bar / FRL switch)
      2. Robot Emergency Pressed [X12] — Fisnar controller E-Stop active
      3. Front Auto Door open Error [X6] — Front door not closed or sensor fault
      4. Machine Emergency Pressed [X0] — Operator panel E-Stop active

      Operators shall not clear alarms without correcting the physical cause.
    images:
      - "Images/HMI Alarms.jpg"

