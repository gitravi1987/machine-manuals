section_5:
  title: "5. Emergency Stop"
  5_1:
    title: "5.1 E-Stop Devices"
    content: |
      Two emergency-stop actuators are photographically confirmed:

      ES-01 — Red mushroom E STOP on the right-hand two-hand station (Images/right side push button and estop.jpg). HMI process banner has displayed Machine Emergency Pressed [X0].

      ES-02 — Red mushroom EMERGENCY STOP on the Fisnar F4303N ADVANCE controller face (Images/component tray button.jpg). HMI live alarm list has displayed Robot Emergency Pressed [X12].

      **NOTICE:** Additional E-Stops, if fitted elsewhere, must be recorded after walk-down. Do not assume only these two devices exist until confirmed.

      E-Stop is for emergency conditions. It is not a substitute for LOTO during maintenance.
    images:
      - "Images/right side push button and estop.jpg"
      - "Images/component tray button.jpg"
      - "Images/two hand button full view.jpg"
  5_2:
    title: "5.2 Activation (flowchart)"
    content: FLOWCHART_ESTOP_ACTIVATE
    flowchart:
      - "Detect emergency condition"
      - "Press nearest E-Stop hard"
      - "Machine motion stops"
      - "Keep clear of process zone"
      - "Alert supervisor if needed"
      - "Do not reset until safe"
  5_3:
    title: "5.3 Reset (flowchart)"
    content: FLOWCHART_ESTOP_RESET
    flowchart:
      - "Identify why E-Stop pressed"
      - "Clear hazard and personnel"
      - "Close side doors fully"
      - "Twist-reset E-Stop device"
      - "Clear HMI emergency alarm"
      - "Press RESET if required"
      - "Confirm ready status"
      - "Restart only if safe"
  5_4:
    title: "5.4 After E-Stop Notes"
    content: |
      • Investigate cause (operator, robot fault, door fault, air pressure, etc.).
      • Check HMI ALARM / LIVE ALARM list and status indicators (EMERGENCY, ROBOT EMERGENCY).
      • Confirm front automatic door and side-door statuses before resuming AUTO.
      • If the dispenser tip was mid-cycle, follow parking/purge guidance before long idle.
      • Repeated unexplained E-Stops → take out of service and call skilled maintenance.

